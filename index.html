# Apprentissage automatique

**Ces IA sont basées sur l'apprentissage automatique (*machine learning*)**, qui consiste à apprendre/entrainer des modèles prédictifs à partir de données exemples. 

Le pipeline de l'apprentissage automatique est divisé en deux phases:
- **L'apprentissage**: on apprend un modèle à partir des données d'apprentissage
- **L'inférence**: on utilise le modèle pour prédire la sortie de chaque nouvelle donnée

.center.width-80.mt-4[![](./medias/mlpipeline.png)]

# L'IA d'aujourd'hui $\approx$ Deep Learning

Les **réseaux de neurones profonds** sont à la base des méthodes d'IA modernes
- Plus il y a de neurones...
- ... plus il y a de paramètres à apprendre
- ... plus il faut de données d'apprentissage
- ... plus l'apprentissage est coûteux en temps de calcul et en argent
- ... mais plus le modèle est puissant et peut résoudre des problèmes complexes


Par exemple, GPT-3 (le modèle de ChatGPT à sa sortie en 2020) .exponent[(1)]
- $175$ milliards de paramètres
- $350$ Go pour stocker le modèle
- $950$ Go de textes pour l'apprentissage
- $34$ jours de calculs, équivalent à $355$ années/GPU (et $4.6$ M$)

.footnote[(1) GPT-4 (2023) est estimé à $10^{12}$ paramètres et $25,000$ GPUs pour un apprentissage sur 6 mois, mais il s'agit d'estimation car les détails exactes n'ont pas été publiés.]

# Apprentissage de représentations

Une **représentation** est une manière de décrire une donnée brute (pixels, mots, mesures) par un vecteur de nombres, où l'information utile à la tâche est facilement accessible.

.row[
.col-49[
**Approche classique**
- On conçoit à la main les caractéristiques (*feature engineering*)
- Demande une expertise du domaine
- Difficile sur des données complexes (images, textes, signaux)
]
.col-2[]
.col-49[
**Apprentissage de représentations**
- Le modèle apprend lui-même les caractéristiques utiles
- Représentation et tâche sont apprises ensemble
- Les couches profondes construisent des représentations de plus en plus abstraites

# L'IA en science et en ingénierie

**Applications numériques**
- Données abondantes et bon marché (clics, images, textes)
- Pas de besoin d'interprétabilité : le modèle est une "boîte noire"
- Erreurs tolérées : peu d'impact si elles sont très minoritaires
- Besoin en généralisation limité : les données d'entraînement sont représentatives des données futures

**Science et ingénierie**
- **Données rares et coûteuses** : une expérience ou une simulation peut durer des jours
- Une bonne prédiction ne suffit pas : il faut une **validation physique ou expérimentale**
- Erreurs à fort coût : sécurité, décision, publication
- Le modèle doit **généraliser hors de ses données d'entraînement** : on lui demande d'extrapoler vers des conditions nouvelles

**L'IA ne doit pas juste être performante, elle doit être cohérente avec les lois scientifiques déjà connues.**

# Équations aux dérivées partielles (EDP)

- En science, la grandeur recherchée dépend souvent de l'espace et du temps (e.g. température d'une pièce) → on parle de **champ** $u(x, t)$
- Ces champs sont en général régis par des **équations aux dérivées partielles** (EDP)
- Dérivée partielle de $u(x\_1, \ldots, x\_n) : \mathbb{R}^n \to \mathbb{R}$:
$$
  \frac{\partial u}{\partial x\_i} = \lim\_{\Delta x\_i \to 0} \frac{u(x\_1, \ldots, x\_i + \Delta x\_i, \ldots, x\_n) - u(x\_1, \ldots, x\_i, \ldots, x\_n)}{\Delta x\_i}
$$
i.e. l'amplitude de la variation de $u$ selon la direction $x\_i$
- Équations aux dérivées partielles (EDP):
$$
  F\left(x\_1, \ldots, x\_n, u, \frac{\partial u}{\partial x\_1}, \ldots, \frac{\partial u}{\partial x\_n}, \frac{\partial^2 u}{\partial x\_1^2}, \frac{\partial^2 u}{\partial x\_1 \partial x\_2}, \ldots \right) = 0
$$

---
# Équations aux dérivées partielles (EDP)

- Comprendre et résoudre ces équations est crucial pour de nombreuses applications scientifiques et industrielles : simulation aérodynamique, prévision météorologique, modélisation biologique, etc.
- **Les solveurs numériques sont coûteux en temps, intensifs en calcul et parfois complexes**

# Pourquoi c'est difficile ?

- Pour entrainer un réseau de neurones à résoudre une EDP, **il faut beaucoup de données**
- Quelle données? des simulations numériques, des mesures expérimentales, des observations réelles
- Obtenir ces données est très coûteux en temps et en ressources, parfois même impossible

# Physics-Informed Neural Network (PINN) .exponent[(1)]

- Réseau de neurones entrainé pour approximer $u_\theta(x, t)$ directement
- Apprentissage pour optimiser la fidélité aux données et la fidélité à l'EDP
- Les dérivées de $u_\theta$ s'obtiennent par **différentiation automatique**

.center.width-75[![](./medias/pinnarchitecture.png)]

.footnote[(1) Maziar Raissi, Paris Perdikaris, George Em Karniadakis, "Physics-informed neural networks: A deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations", Journal of Computational Physics, 2019]

---
# Example: équation de Burgers

Soit $\nu = 0.01 / \pi$, $x \in [-1, 1]$, $t \in [0, 1]$ et $u: [-1, 1] \times [0, 1] \to \mathbb{R}$:

.row[
.col-40[
$$
\begin{cases}
  \frac{\partial u}{\partial t} + u \frac{\partial u}{\partial x} - \nu \frac{\partial^2 u}{\partial x^2} = 0\\\\
  u(x,0) = -\sin(\pi x)\\\\
  u(-1,t) = u(1,t) = 0
\end{cases}
$$

.mt-5[Ci-contre: Réseau entrainé sur:
- $100$ points tels que $t=0$, $x=-1$ ou $x=1$ 
- $10,000$ points de collocation dans $[-1, 1] \times [0, 1]$]
]
.col-55.center[
.center.width-100.mt-2[![](./medias/pinnburgers.png)]
]
]

# Neural Operator

.row.mt-2[
.col-60[
- Les PINN apprennent la solution d'une EDP avec des conditions initiales et aux limites fixées
- Si on veut résoudre la même EDP avec **d'autres conditions, il faut ré-entrainer le réseau**
- Objectif : apprendre l'**opérateur** $\mathcal{G} : a \mapsto u$, qui associe à une entrée (conditions, paramètres) la solution complète
- A **neural operator** apprend $\mathcal{G}$ à partir d'un ensemble d'instance déjà résolues
]
.col-5[]
.col-35.center[
.width-95[![](./medias/neuraloperator.png)]
]
]

# Fourier Neural Operator (FNO) .exponent[(1)]

- Apprend des représentations de $a$ dans l'espace de Fourier (branche du haut): dynamique globale
- Apprend aussi des représentations locales dans l'espace physique (branche du bas): dynamique locale

.center.width-75[![](./medias/fno.png)

]

.footnote[(1) Zongyi Li, Nikola Kovachki, Kamyar Azizzadenesheli, Burigede Liu, Andrew Stuart, Anima Anandkumar, Kaushik Bhattacharya, "Fourier Neural Operator for Parametric Partial Differential Equations", ICLR 2021]

# Prédiction de la structure des protéines

- Les cellules vivantes sont constituées de protéines, qui participent aux fonctions essentielles de la vie
- Une protéine est une chaîne d'acides aminés, déterminée par le code génétique (ADN)
- Cette chaîne se replie en une structure 3D spécifique, à la faveur des intéractions chimiques
- **Comprendre, prédire et maîtriser ce repliement est un enjeu majeur en biologie et en médecine**

# En (très) résumé...

**IA pour les sciences: le nouveau graal de la communauté scientifique** 
- environ 80 150 publications sur l’IA en sciences naturelles en 2025, soit +26 % en un an.
- Objectif: combiner les connaissances scientifiques et l'apprentissage profond
- Déjà beaucoup d'approches prometteuses (PINN et FNO ne sont que deux exemples)


**Des succés réels**
- Par ex., plusieurs modèles météo IA sont déployés opérationnellement (prévisions jusqu'à 60 jours en moins de 4 minutes sur un GPU)
- Mais **encore beaucoup de problèmes ouverts**: interprétabilité, généralisation (on y est pas encore), problème inverse (découvrir des lois de la physique à l'aide de l'IA)
- Énormement de potentiel pour faire progresser les sciences et l'ingénierie **mais est-ce que l'IA remplace l'expérimentation?**

         * - Display math: $$...$$ or \[...\]
         * - Inline math: $...$ or \(...\)
         * (from https://github.com/gnab/remark/wiki/LaTeX-Using-KaTeX)
         */
        let renderMath = function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false},
                ]
            });
        };

        // Create the slideshow
        let slideshow = remark.create(options, renderMath);

        /**
         * When DOM is loaded add the "target=_blank" attribute to all links that have a "http" or "https" protocol.
         * This will make external links open in a new tab.
         */
        document.addEventListener("DOMContentLoaded", function() {
            let links = document.querySelectorAll("a[href^='http']");
            links.forEach(function(link) {
                link.setAttribute("target", "_blank");
            });
        });
    </script>

</body>
</html>
